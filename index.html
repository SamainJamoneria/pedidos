<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samain - Gestión de Pedidos</title>
    
    <!-- Configuración para PWA e Icono de la App -->
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B2238">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #1B2238;
            color: #F3F4F6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .card-bg {
            background-color: #242E4B;
        }
        .card-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Ocultar flechas de inputs numéricos */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- Header Fijo Superior -->
    <header class="sticky top-0 z-30 card-bg card-border shadow-md px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <!-- Imagen icono.png en la cabecera -->
            <img src="icono.png" alt="Samain Icono" class="w-10 h-10 rounded-xl object-cover shadow-inner border border-amber-400/30">
            <div>
                <h1 class="font-bold text-base leading-tight text-white tracking-wide">Samain</h1>
                <p class="text-xs text-amber-300/90 font-medium">La Cormelana • Pedidos</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="abrirModalNuevoBloque()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow transition flex items-center space-x-1">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Bloque</span>
            </button>
            <button onclick="reiniciarCantidades()" class="text-gray-400 hover:text-red-400 p-2 rounded-xl transition" title="Reiniciar contadores">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Contenedor Principal de Bloques -->
    <main id="app-container" class="max-w-xl mx-auto p-4 space-y-4">
        <!-- Renderizado dinámico vía JavaScript -->
    </main>

    <!-- Barra de Acciones Globales (Inferior Fija) -->
    <nav class="fixed bottom-0 left-0 right-0 card-bg card-border p-3 shadow-2xl z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-xl mx-auto grid grid-cols-2 gap-3">
            <button onclick="exportarTodoPDF()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition active:scale-95">
                <i class="fa-solid fa-file-pdf text-base"></i>
                <span>PDF General</span>
            </button>
            <button onclick="enviarTodoWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition active:scale-95">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>Enviar WhatsApp</span>
            </button>
        </div>
    </nav>

    <!-- Modales Genéricos -->
    <!-- Modal Artículo -->
    <div id="modal-articulo" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="card-bg card-border w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <h3 id="modal-articulo-titulo" class="text-base font-bold text-white">Añadir Artículo</h3>
            <input type="text" id="input-nombre-articulo" placeholder="Nombre del artículo..." class="w-full bg-[#1B2238] border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex space-x-3 pt-2">
                <button onclick="cerrarModalArticulo()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="guardarArticulo()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Bloque -->
    <div id="modal-bloque" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="card-bg card-border w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <h3 id="modal-bloque-titulo" class="text-base font-bold text-white">Nuevo Bloque</h3>
            <input type="text" id="input-nombre-bloque" placeholder="Nombre de la categoría..." class="w-full bg-[#1B2238] border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
            <div class="flex space-x-3 pt-2">
                <button onclick="cerrarModalBloque()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="guardarBloque()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        // Nueva estructura por defecto con soporte de Subloques y los elementos pedidos
        const datosIniciales = [
            {
                id: "bloque-1",
                nombre: "Estrella",
                colapsado: false,
                subloques: [
                    {
                        id: "sub-1-1",
                        nombre: "Tanque",
                        items: [ { id: 101, nombre: "Estrella", cantidad: 0 } ]
                    },
                    {
                        id: "sub-1-2",
                        nombre: "Barriles",
                        items: [
                            { id: 102, nombre: "0,0 Tostada", cantidad: 0 },
                            { id: 103, nombre: "Radler", cantidad: 0 },
                            { id: 104, nombre: "1906", cantidad: 0 },
                            { id: 105, nombre: "Estrella", cantidad: 0 },
                            { id: 106, nombre: "Tinto de Verano", cantidad: 0 }
                        ]
                    },
                    {
                        id: "sub-1-3",
                        nombre: "Cajas",
                        items: [
                            { id: 107, nombre: "0,0 Rubia", cantidad: 0 },
                            { id: 108, nombre: "Red Vintage", cantidad: 0 },
                            { id: 109, nombre: "Reposada", cantidad: 0 },
                            { id: 110, nombre: "Sin Gluten", cantidad: 0 }
                        ]
                    },
                    {
                        id: "sub-1-4",
                        nombre: "Aguas",
                        items: [
                            { id: 111, nombre: "Magma Aluminio con gas", cantidad: 0 },
                            { id: 112, nombre: "Agua", cantidad: 0 }
                        ]
                    }
                ]
            },
            { id: "bloque-2", nombre: "Coca-cola", colapsado: false, items: [ {id: 3, nombre: "Coca-Cola Original 2L", cantidad: 0}, {id: 4, nombre: "Coca-Cola Zero", cantidad: 0} ] },
            { 
                id: "bloque-3", 
                nombre: "Embutidos", 
                colapsado: false, 
                items: [ 
                    {id: 5, nombre: "Jamón", cantidad: 0}, 
                    {id: 6, nombre: "Lomo", cantidad: 0},
                    {id: 19, nombre: "Salchichón", cantidad: 0},
                    {id: 20, nombre: "Chorizo", cantidad: 0},
                    {id: 21, nombre: "Cecina", cantidad: 0},
                    {id: 22, nombre: "Chicharrones", cantidad: 0}
                ] 
            },
            { id: "bloque-4", nombre: "Quesos", colapsado: false, items: [ {id: 7, nombre: "Queso Tetilla", cantidad: 0}, {id: 8, nombre: "Queso Arzúa-Ulloa", cantidad: 0} ] },
            { id: "bloque-5", nombre: "Fruta", colapsado: false, items: [ {id: 9, nombre: "Tomates", cantidad: 0}, {id: 10, nombre: "Uva blanca", cantidad: 0}, {id: 23, nombre: "Uva roja", cantidad: 0} ] },
            { id: "bloque-6", nombre: "Helados", colapsado: false, items: [ {id: 11, nombre: "Helado Vainilla", cantidad: 0}, {id: 12, nombre: "Helado Chocolate", cantidad: 0} ] },
            { id: "bloque-7", nombre: "Limpieza", colapsado: false, items: [ {id: 13, nombre: "Lejía industrial", cantidad: 0}, {id: 14, nombre: "Papel higiénico", cantidad: 0} ] },
            { id: "bloque-8", nombre: "Café", colapsado: false, items: [ {id: 15, nombre: "Café en grano 1kg", cantidad: 0} ] },
            {
                id: "bloque-9",
                nombre: "Alcohol y Vino",
                colapsado: false,
                subloques: [
                    {
                        id: "sub-9-1",
                        nombre: "Vinos",
                        items: [
                            { id: 24, nombre: "Vino Rías Baixas Albariño", cantidad: 0 },
                            { id: 25, nombre: "Vino Tinto Rioja Crianza", cantidad: 0 }
                        ]
                    },
                    {
                        id: "sub-9-2",
                        nombre: "Alcohol",
                        items: [
                            { id: 26, nombre: "Ron", cantidad: 0 },
                            { id: 27, nombre: "Ginebra", cantidad: 0 }
                        ]
                    }
                ]
            }
        ];

        let state;
        try {
            const savedState = localStorage.getItem('samain_pedidos_state_v2');
            state = savedState ? JSON.parse(savedState) : datosIniciales;
        } catch (e) {
            state = datosIniciales;
        }

        let editandoBloqueId = null;
        let editandoArticuloContext = null; 

        function guardarEstado() {
            localStorage.setItem('samain_pedidos_state_v2', JSON.stringify(state));
            render();
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            state.forEach(bloque => {
                // Contar total items activos (soporta tanto bloques con items directos como bloques con subloques)
                let totalItemsActivos = 0;
                if (bloque.subloques) {
                    bloque.subloques.forEach(sub => sub.items.forEach(i => { if(i.cantidad > 0) totalItemsActivos++; }));
                } else if (bloque.items) {
                    totalItemsActivos = bloque.items.filter(i => i.cantidad > 0).length;
                }
                
                const card = document.createElement('div');
                card.className = 'card-bg card-border rounded-2xl shadow-lg overflow-hidden transition-all duration-200';
                
                // Cabecera del Bloque Principal
                let html = `
                    <div class="px-4 py-3.5 bg-[#2A3655]/60 flex items-center justify-between border-b border-white/5">
                        <div class="flex items-center space-x-2 flex-1 min-w-0 mr-2">
                            <button onclick="toggleColapsar('${bloque.id}')" class="text-indigo-400 hover:text-indigo-300 p-1">
                                <i class="fa-solid ${bloque.colapsado ? 'fa-chevron-right' : 'fa-chevron-down'} text-xs"></i>
                            </button>
                            <span class="font-bold text-white text-sm truncate tracking-wide">${bloque.nombre}</span>
                            ${totalItemsActivos > 0 ? `<span class="bg-amber-500/20 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-500/30">${totalItemsActivos}</span>` : ''}
                        </div>
                        <div class="flex items-center space-x-1 text-gray-300">
                            ${!bloque.subloques ? `<button onclick="abrirModalNuevoArticulo('${bloque.id}', null)" class="p-1.5 hover:text-amber-300 rounded-lg transition" title="Añadir artículo"><i class="fa-solid fa-plus text-xs"></i></button>` : ''}
                            <button onclick="abrirModalEditarBloque('${bloque.id}')" class="p-1.5 hover:text-indigo-300 rounded-lg transition" title="Editar bloque"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="exportarBloquePDF('${bloque.id}')" class="p-1.5 hover:text-red-400 rounded-lg transition" title="Exportar Bloque a PDF"><i class="fa-solid fa-file-pdf text-xs"></i></button>
                            <button onclick="enviarBloqueWhatsApp('${bloque.id}')" class="p-1.5 hover:text-emerald-400 rounded-lg transition" title="Enviar Bloque por WhatsApp"><i class="fa-brands fa-whatsapp text-sm"></i></button>
                            <button onclick="borrarBloque('${bloque.id}')" class="p-1.5 hover:text-red-400 rounded-lg transition" title="Borrar bloque"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                `;

                // Contenido (si no está colapsado)
                if (!bloque.colapsado) {
                    html += `<div class="p-3 space-y-3">`;
                    
                    // Si el bloque tiene subloques
                    if (bloque.subloques) {
                        bloque.subloques.forEach(subloque => {
                            html += `
                                <div class="bg-[#1B2238]/40 border border-white/5 rounded-xl p-2.5 space-y-2">
                                    <div class="flex items-center justify-between border-b border-white/5 pb-1.5">
                                        <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">${subloque.nombre}</span>
                                        <button onclick="abrirModalNuevoArticulo('${bloque.id}', '${subloque.id}')" class="text-gray-400 hover:text-amber-300 text-xs px-1.5 py-0.5 rounded transition" title="Añadir a ${subloque.nombre}">
                                            <i class="fa-solid fa-plus text-[10px]"></i> Añadir
                                        </button>
                                    </div>
                                    <div class="space-y-2">
                            `;
                            
                            if (subloque.items.length === 0) {
                                html += `<p class="text-[11px] text-gray-500 italic py-1">Vacío</p>`;
                            } else {
                                subloque.items.forEach(item => {
                                    html += renderItemHTML(bloque.id, item, subloque.id);
                                });
                            }
                            html += `</div></div>`;
                        });
                    } 
                    // Si el bloque tiene items directos
                    else if (bloque.items) {
                        if (bloque.items.length === 0) {
                            html += `<p class="text-xs text-gray-400 text-center py-2 italic">No hay artículos en este bloque.</p>`;
                        } else {
                            bloque.items.forEach(item => {
                                html += renderItemHTML(bloque.id, item, null);
                            });
                        }
                    }
                    html += `</div>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function renderItemHTML(bloqueId, item, subloqueId) {
            return `
                <div class="flex items-center justify-between bg-[#1B2238]/70 p-2.5 rounded-xl border border-white/5">
                    <div class="flex-1 min-w-0 pr-2">
                        <span class="text-xs font-medium text-gray-200 block truncate">${item.nombre}</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <div class="flex items-center bg-[#242E4B] border border-gray-700/80 rounded-xl overflow-hidden shadow-inner">
                            <button onclick="cambiarCantidad('${bloqueId}', ${item.id}, -1, '${subloqueId || ''}')" class="w-8 h-8 bg-gray-800 hover:bg-gray-700 text-gray-300 flex items-center justify-center transition active:bg-gray-600">
                                <i class="fa-solid fa-minus text-[10px]"></i>
                            </button>
                            <input type="number" min="0" value="${item.cantidad}" 
                                onchange="actualizarCantidadDirecta('${bloqueId}', ${item.id}, this.value, '${subloqueId || ''}')"
                                class="w-10 text-center bg-transparent text-white text-xs font-bold focus:outline-none">
                            <button onclick="cambiarCantidad('${bloqueId}', ${item.id}, 1, '${subloqueId || ''}')" class="w-8 h-8 bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition active:bg-indigo-700">
                                <i class="fa-solid fa-plus text-[10px]"></i>
                            </button>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="abrirModalEditarArticulo('${bloqueId}', ${item.id}, '${item.nombre}', '${subloqueId || ''}')" class="text-gray-400 hover:text-indigo-300 p-1 transition" title="Editar artículo">
                                <i class="fa-solid fa-pen text-[10px]"></i>
                            </button>
                            <button onclick="borrarArticulo('${bloqueId}', ${item.id}, '${subloqueId || ''}')" class="text-gray-400 hover:text-red-400 p-1 transition" title="Eliminar artículo">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Acciones sobre Cantidades
        function buscarItemEnBloque(bloque, itemId, subloqueId) {
            if (subloqueId) {
                const sub = bloque.subloques.find(s => s.id === subloqueId);
                return sub ? sub.items.find(i => i.id === itemId) : null;
            } else if (bloque.items) {
                return bloque.items.find(i => i.id === itemId);
            }
            return null;
        }

        function cambiarCantidad(bloqueId, itemId, delta, subloqueId) {
            const bloque = state.find(b => b.id === bloqueId);
            if (!bloque) return;
            const item = buscarItemEnBloque(bloque, itemId, subloqueId);
            if (!item) return;

            item.cantidad = Math.max(0, item.cantidad + delta);
            guardarEstado();
        }

        function actualizarCantidadDirecta(bloqueId, itemId, valor, subloqueId) {
            const bloque = state.find(b => b.id === bloqueId);
            if (!bloque) return;
            const item = buscarItemEnBloque(bloque, itemId, subloqueId);
            if (!item) return;

            const num = parseInt(valor);
            item.cantidad = isNaN(num) || num < 0 ? 0 : num;
            guardarEstado();
        }

        function toggleColapsar(bloqueId) {
            const bloque = state.find(b => b.id === bloqueId);
            if (bloque) {
                bloque.colapsado = !bloque.colapsado;
                guardarEstado();
            }
        }

        function reiniciarCantidades() {
            if (confirm("¿Estás seguro de poner a cero todas las cantidades?")) {
                state.forEach(b => {
                    if (b.subloques) {
                        b.subloques.forEach(s => s.items.forEach(i => i.cantidad = 0));
                    } else if (b.items) {
                        b.items.forEach(i => i.cantidad = 0);
                    }
                });
                guardarEstado();
            }
        }

        // Modales de Bloques y Artículos
        function abrirModalNuevoBloque() {
            editandoBloqueId = null;
            document.getElementById('modal-bloque-titulo').innerText = "Nuevo Bloque";
            document.getElementById('input-nombre-bloque').value = "";
            document.getElementById('modal-bloque').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-bloque').focus(), 50);
        }

        function abrirModalEditarBloque(bloqueId) {
            editandoBloqueId = bloqueId;
            const bloque = state.find(b => b.id === bloqueId);
            document.getElementById('modal-bloque-titulo').innerText = "Editar Bloque";
            document.getElementById('input-nombre-bloque').value = bloque ? bloque.nombre : "";
            document.getElementById('modal-bloque').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-bloque').focus(), 50);
        }

        function cerrarModalBloque() {
            document.getElementById('modal-bloque').classList.add('hidden');
        }

        function guardarBloque() {
            const nombre = document.getElementById('input-nombre-bloque').value.trim();
            if (!nombre) return alert("Introduce un nombre válido");

            if (editandoBloqueId) {
                const bloque = state.find(b => b.id === editandoBloqueId);
                if (bloque) bloque.nombre = nombre;
            } else {
                const nuevoId = "bloque-" + Date.now();
                state.push({ id: nuevoId, nombre: nombre, colapsado: false, items: [] });
            }
            cerrarModalBloque();
            guardarEstado();
        }

        function borrarBloque(bloqueId) {
            if (confirm("¿Eliminar este bloque y todos sus elementos?")) {
                state = state.filter(b => b.id !== bloqueId);
                guardarEstado();
            }
        }

        function abrirModalNuevoArticulo(bloqueId, subloqueId) {
            editandoArticuloContext = { bloqueId: bloqueId, subloqueId: subloqueId, articuloId: null };
            document.getElementById('modal-articulo-titulo').innerText = "Añadir Artículo";
            document.getElementById('input-nombre-articulo').value = "";
            document.getElementById('modal-articulo').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-articulo').focus(), 50);
        }

        function abrirModalEditarArticulo(bloqueId, articuloId, nombreActual, subloqueId) {
            editandoArticuloContext = { bloqueId: bloqueId, subloqueId: subloqueId || null, articuloId: articuloId };
            document.getElementById('modal-articulo-titulo').innerText = "Editar Artículo";
            document.getElementById('input-nombre-articulo').value = nombreActual;
            document.getElementById('modal-articulo').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-articulo').focus(), 50);
        }

        function cerrarModalArticulo() {
            document.getElementById('modal-articulo').classList.add('hidden');
        }

        function guardarArticulo() {
            const nombre = document.getElementById('input-nombre-articulo').value.trim();
            if (!nombre) return alert("Introduce un nombre válido");

            const bloque = state.find(b => b.id === editandoArticuloContext.bloqueId);
            if (!bloque) return;

            let listaItemsTarget = null;
            if (editandoArticuloContext.subloqueId) {
                const sub = bloque.subloques.find(s => s.id === editandoArticuloContext.subloqueId);
                if (sub) listaItemsTarget = sub.items;
            } else {
                if (!bloque.items) bloque.items = [];
                listaItemsTarget = bloque.items;
            }

            if (!listaItemsTarget) return;

            if (editandoArticuloContext.articuloId !== null) {
                const item = listaItemsTarget.find(i => i.id === editandoArticuloContext.articuloId);
                if (item) item.nombre = nombre;
            } else {
                const nuevoItem = { id: Date.now(), nombre: nombre, cantidad: 0 };
                listaItemsTarget.push(nuevoItem);
            }
            cerrarModalArticulo();
            guardarEstado();
        }

        function borrarArticulo(bloqueId, articuloId, subloqueId) {
            const bloque = state.find(b => b.id === bloqueId);
            if (!bloque) return;

            if (subloqueId) {
                const sub = bloque.subloques.find(s => s.id === subloqueId);
                if (sub) sub.items = sub.items.filter(i => i.id !== articuloId);
            } else if (bloque.items) {
                bloque.items = bloque.items.filter(i => i.id !== articuloId);
            }
            guardarEstado();
        }

        // Exportar WhatsApp y PDF
        function generarTextoPedido(filtrarBloqueId = null) {
            const fecha = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            let texto = `📋 *PEDIDO SAMAIN - LA CORMELANA*\n📅 Fecha: ${fecha}\n\n`;
            let hayArticulos = false;

            const bloquesAProcesar = filtrarBloqueId ? state.filter(b => b.id === filtrarBloqueId) : state;

            bloquesAProcesar.forEach(bloque => {
                let bloqueTieneActivos = false;
                let textoBloque = `▪️ *${bloque.nombre.toUpperCase()}*\n`;

                if (bloque.subloques) {
                    bloque.subloques.forEach(sub => {
                        const activosSub = sub.items.filter(i => i.cantidad > 0);
                        if (activosSub.length > 0) {
                            bloqueTieneActivos = true;
                            textoBloque += `   _📦 ${sub.name || sub.nombre}_\n`;
                            activosSub.forEach(item => {
                                textoBloque += `     - ${item.nombre}: *${item.cantidad}*\n`;
                            });
                        }
                    });
                } else if (bloque.items) {
                    const activos = bloque.items.filter(i => i.cantidad > 0);
                    if (activos.length > 0) {
                        bloqueTieneActivos = true;
                        activos.forEach(item => {
                            textoBloque += `   - ${item.nombre}: *${item.cantidad}*\n`;
                        });
                    }
                }

                if (bloqueTieneActivos) {
                    hayArticulos = true;
                    texto += textoBloque + `\n`;
                }
            });

            if (!hayArticulos) return null;
            return texto.trim();
        }

        function enviarTodoWhatsApp() {
            const texto = generarTextoPedido();
            if (!texto) return alert("No hay ningún artículo con cantidad mayor a 0 para enviar.");
            window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function enviarBloqueWhatsApp(bloqueId) {
            const texto = generarTextoPedido(bloqueId);
            if (!texto) return alert("Este bloque no tiene artículos seleccionados (> 0).");
            window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function exportarTodoPDF() { exportarPDF(null); }
        function exportarBloquePDF(bloqueId) { exportarPDF(bloqueId); }

        function exportarPDF(filtrarBloqueId = null) {
            const fecha = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const bloquesAProcesar = filtrarBloqueId ? state.filter(b => b.id === filtrarBloqueId) : state;

            let contenidoHTML = `
                <html>
                <head>
                    <title>Pedido - Samain La Cormelana</title>
                    <style>
                        body { font-family: sans-serif; padding: 20px; color: #111; }
                        h1 { color: #1B2238; border-bottom: 2px solid #1B2238; padding-bottom: 5px; font-size: 20px; }
                        .fecha { font-size: 12px; color: #555; margin-bottom: 20px; }
                        .bloque { margin-bottom: 15px; }
                        .bloque-title { font-weight: bold; background: #f0f0f0; padding: 6px 10px; font-size: 14px; border-radius: 4px; }
                        .sub-title { font-weight: bold; font-size: 12px; margin: 6px 0 2px 10px; color: #444; }
                        ul { margin: 2px 0 10px 25px; padding: 0; list-style-type: disc; }
                        li { font-size: 13px; margin-bottom: 3px; }
                    </style>
                </head>
                <body>
                    <h1>Samain - La Cormelana (Gestión de Pedidos)</h1>
                    <div class="fecha">Generado el: ${fecha}</div>
            `;

            let hayContenido = false;
            bloquesAProcesar.forEach(bloque => {
                let bloqueTieneContenido = false;
                let htmlBloque = `<div class="bloque"><div class="bloque-title">${bloque.nombre}</div>`;

                if (bloque.subloques) {
                    bloque.subloques.forEach(sub => {
                        const activosSub = sub.items.filter(i => i.cantidad > 0);
                        if (activosSub.length > 0) {
                            bloqueTieneContenido = true;
                            htmlBloque += `<div class="sub-title">${sub.nombre}</div><ul>`;
                            activosSub.forEach(item => {
                                htmlBloque += `<li>${item.nombre}: <strong>${item.cantidad} unidades</strong></li>`;
                            });
                            htmlBloque += `</ul>`;
                        }
                    });
                } else if (bloque.items) {
                    const activos = bloque.items.filter(i => i.cantidad > 0);
                    if (activos.length > 0) {
                        bloqueTieneContenido = true;
                        htmlBloque += `<ul>`;
                        activos.forEach(item => {
                            htmlBloque += `<li>${item.nombre}: <strong>${item.cantidad} unidades</strong></li>`;
                        });
                        htmlBloque += `</ul>`;
                    }
                }

                htmlBloque += `</div>`;
                if (bloqueTieneContenido) {
                    hayContenido = true;
                    contenidoHTML += htmlBloque;
                }
            });

            if (!hayContenido) {
                return alert("No hay artículos con cantidad seleccionada (> 0) para exportar.");
            }

            contenidoHTML += `</body></html>`;
            const ventanaPDF = window.open('', '_blank');
            ventanaPDF.document.write(contenidoHTML);
            ventanaPDF.document.close();
            ventanaPDF.focus();
            setTimeout(() => { ventanaPDF.print(); }, 300);
        }

        render();
    </script>
</body>
</html>
